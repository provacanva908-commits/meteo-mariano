name: Aggiorna notizie sportive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crea feed sportivo
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python <<'PY'
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          ITALY_TZ = ZoneInfo("Europe/Rome")
          now_italy = datetime.now(ITALY_TZ)
          today = now_italy.date()
          tomorrow = today + timedelta(days=1)

          FOOTBALL_DATA_TOKEN = os.environ.get("FOOTBALL_DATA_TOKEN", "")

          IMPORTANT_COMPETITIONS = [
              "Serie A",
              "UEFA Champions League",
              "UEFA Europa League",
              "UEFA Conference League"
          ]

          FOOTBALL_DATA_COMPETITIONS = [
              "SA",
              "CL",
              "EL",
              "CLI",
              "PL",
              "PD",
              "BL1",
              "FL1",
              "DED",
              "PPL"
          ]

          TOP_FOREIGN_TEAMS = [
              "Real Madrid",
              "Barcelona",
              "FC Barcelona",
              "Atlético Madrid",
              "Atletico Madrid",
              "Manchester City",
              "Manchester United",
              "Liverpool",
              "Arsenal",
              "Chelsea",
              "Tottenham",
              "Bayern Munich",
              "FC Bayern München",
              "Borussia Dortmund",
              "Paris Saint-Germain",
              "PSG",
              "Marseille",
              "Olympique Marseille",
              "Lyon",
              "Olympique Lyonnais",
              "Benfica",
              "Porto",
              "FC Porto",
              "Sporting CP",
              "Sporting",
              "Ajax",
              "PSV",
              "Feyenoord"
          ]

          ITALIAN_TEAMS = [
              "Inter",
              "Milan",
              "Juventus",
              "Napoli",
              "Roma",
              "Lazio",
              "Atalanta",
              "Fiorentina",
              "Bologna",
              "Torino",
              "Genoa",
              "Sampdoria",
              "Como",
              "Monza",
              "Udinese",
              "Sassuolo",
              "Parma",
              "Cagliari",
              "Lecce",
              "Verona",
              "Hellas Verona"
          ]

          blocked_phrases = [
              "guarda il video",
              "video:",
              "foto:",
              "fotogallery",
              "gallery",
              "highlights",
              "virale",
              "sui social",
              "clicca qui",
              "da non perdere",
              "curiosità",
              "gossip",
              "retroscena social"
          ]

          important_keywords = {
              "CALCIOMERCATO": [
                  "calciomercato",
                  "mercato",
                  "trattativa",
                  "ufficiale",
                  "accordo",
                  "firma",
                  "prestito",
                  "rinnovo",
                  "cessione",
                  "acquisto",
                  "offerta",
                  "inter",
                  "milan",
                  "juventus",
                  "napoli",
                  "roma",
                  "lazio",
                  "atalanta",
                  "como",
                  "monza"
              ],
              "CALCIO": [
                  "serie a",
                  "coppa italia",
                  "champions",
                  "champions league",
                  "europa league",
                  "conference league",
                  "nazionale",
                  "italia",
                  "milan",
                  "inter",
                  "juventus",
                  "napoli",
                  "roma",
                  "lazio",
                  "atalanta",
                  "como",
                  "monza",
                  "real madrid",
                  "barcellona",
                  "barcelona",
                  "manchester city",
                  "manchester united",
                  "liverpool",
                  "arsenal",
                  "chelsea",
                  "bayern",
                  "psg",
                  "ufficiale",
                  "infortunio",
                  "allenatore",
                  "convocati",
                  "calendario",
                  "partita",
                  "risultato"
              ],
              "TENNIS": [
                  "sinner",
                  "atp",
                  "wta",
                  "wimbledon",
                  "us open",
                  "roland garros",
                  "australian open",
                  "ranking",
                  "torneo",
                  "finale",
                  "semifinale",
                  "vittoria",
                  "sconfitta",
                  "alcaraz",
                  "djokovic"
              ],
              "PADEL": [
                  "padel",
                  "premier padel",
                  "fip",
                  "torneo",
                  "finale",
                  "semifinale",
                  "ranking",
                  "coello",
                  "tapia",
                  "galan",
                  "lebron"
              ]
          }

          def clean_text(value):
              value = html.unescape(value or "")
              value = re.sub(r"\s+", " ", value)
              return value.strip()

          def normalize(value):
              return clean_text(value).lower()

          def is_blocked(title):
              normalized = title.lower()
              return any(phrase in normalized for phrase in blocked_phrases)

          def contains_any(text, words):
              text_norm = normalize(text)
              for word in words:
                  if normalize(word) in text_norm:
                      return True
              return False

          def importance_score(title, category):
              normalized = title.lower()
              score = 0

              for keyword in important_keywords.get(category, []):
                  if keyword in normalized:
                      score += 2

              if any(word in normalized for word in [
                  "oggi",
                  "domani",
                  "ufficiale",
                  "ultim'ora",
                  "breaking",
                  "accordo",
                  "firma",
                  "live",
                  "diretta",
                  "risultato",
                  "finale"
              ]):
                  score += 2

              if any(word in normalized for word in [
                  "video",
                  "foto",
                  "social",
                  "curiosità",
                  "gossip"
              ]):
                  score -= 6

              return score

          def fetch_google_news(category, query, limit=4):
              encoded_query = urllib.parse.quote_plus(query)

              feed_url = (
                  "https://news.google.com/rss/search"
                  f"?q={encoded_query}"
                  "&hl=it"
                  "&gl=IT"
                  "&ceid=IT:it"
              )

              request = urllib.request.Request(
                  feed_url,
                  headers={
                      "User-Agent": (
                          "Mozilla/5.0 "
                          "(Windows NT 10.0; Win64; x64)"
                      )
                  }
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  xml_data = response.read()

              root = ET.fromstring(xml_data)

              results = []
              seen = set()

              for item in root.findall("./channel/item"):
                  title = clean_text(item.findtext("title", ""))

                  if not title:
                      continue

                  normalized = title.lower()

                  if normalized in seen:
                      continue

                  if is_blocked(title):
                      continue

                  score = importance_score(title, category)

                  if score < 1:
                      continue

                  source_element = item.find("source")

                  source = (
                      clean_text(source_element.text)
                      if source_element is not None and source_element.text
                      else "Google News"
                  )

                  published = clean_text(
                      item.findtext("pubDate", "")
                  )

                  results.append({
                      "type": "news",
                      "category": category,
                      "title": title,
                      "source": source,
                      "published": published,
                      "_score": score
                  })

                  seen.add(normalized)

              results.sort(
                  key=lambda item: item["_score"],
                  reverse=True
              )

              selected = results[:limit]

              for result in selected:
                  result.pop("_score", None)

              return selected

          def convert_utc_to_italy_time(value):
              if not value:
                  return ""

              try:
                  date = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
                  local = date.astimezone(ITALY_TZ)
                  return local.strftime("%H:%M")
              except Exception:
                  return ""

          def get_match_local_date(value):
              try:
                  date = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
                  local = date.astimezone(ITALY_TZ)
                  return local.date()
              except Exception:
                  return None

          def get_score(match):
              score = match.get("score", {})
              full_time = score.get("fullTime", {}) or {}
              half_time = score.get("halfTime", {}) or {}

              home_score = full_time.get("home")
              away_score = full_time.get("away")

              if home_score is None or away_score is None:
                  home_score = half_time.get("home")
                  away_score = half_time.get("away")

              return home_score, away_score

          def status_label(status):
              labels = {
                  "SCHEDULED": "In programma",
                  "TIMED": "In programma",
                  "IN_PLAY": "LIVE",
                  "PAUSED": "Intervallo",
                  "FINISHED": "Finale",
                  "POSTPONED": "Rinviata",
                  "SUSPENDED": "Sospesa",
                  "CANCELED": "Annullata"
              }

              return labels.get(status, status or "")

          def is_important_match(match):
              competition = match.get("competition", {}).get("name", "")
              competition_code = match.get("competition", {}).get("code", "")

              home = match.get("homeTeam", {}).get("shortName") or match.get("homeTeam", {}).get("name", "")
              away = match.get("awayTeam", {}).get("shortName") or match.get("awayTeam", {}).get("name", "")

              teams_text = home + " " + away

              if competition_code in ["SA", "CL", "EL", "CLI"]:
                  return True

              if contains_any(competition, IMPORTANT_COMPETITIONS):
                  return True

              if contains_any(teams_text, ITALIAN_TEAMS):
                  return True

              if contains_any(teams_text, TOP_FOREIGN_TEAMS):
                  return True

              return False

          def fetch_matches_for_competition(code):
              url = (
                  "https://api.football-data.org/v4/matches"
                  "?competitions=" + code +
                  "&dateFrom=" + today.isoformat() +
                  "&dateTo=" + tomorrow.isoformat()
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "X-Auth-Token": FOOTBALL_DATA_TOKEN,
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              return data.get("matches", [])

          def fetch_football_matches():
              if not FOOTBALL_DATA_TOKEN:
                  print("FOOTBALL_DATA_TOKEN assente")
                  return []

              all_matches = []
              seen_ids = set()

              for code in FOOTBALL_DATA_COMPETITIONS:
                  try:
                      matches = fetch_matches_for_competition(code)

                      for match in matches:
                          match_id = match.get("id")

                          if match_id in seen_ids:
                              continue

                          seen_ids.add(match_id)
                          all_matches.append(match)

                  except Exception as error:
                      print(
                          "Errore recupero competizione",
                          code,
                          error
                      )

              result = []

              priority = {
                  "IN_PLAY": 1,
                  "PAUSED": 2,
                  "FINISHED": 3,
                  "TIMED": 4,
                  "SCHEDULED": 5
              }

              for match in all_matches:
                  if not is_important_match(match):
                      continue

                  status = match.get("status", "")
                  utc_date = match.get("utcDate", "")
                  local_date = get_match_local_date(utc_date)

                  if local_date not in [today, tomorrow]:
                      continue

                  home = match.get("homeTeam", {}).get("shortName") or match.get("homeTeam", {}).get("name", "")
                  away = match.get("awayTeam", {}).get("shortName") or match.get("awayTeam", {}).get("name", "")
                  competition = match.get("competition", {}).get("name", "Calcio")

                  home_score, away_score = get_score(match)

                  item = {
                      "type": "match",
                      "category": "CALCIO",
                      "competition": competition,
                      "home": home,
                      "away": away,
                      "time": convert_utc_to_italy_time(utc_date),
                      "status": status,
                      "status_label": status_label(status),
                      "home_score": home_score,
                      "away_score": away_score,
                      "is_live": status in ["IN_PLAY", "PAUSED"],
                      "local_date": str(local_date),
                      "_priority": priority.get(status, 9)
                  }

                  result.append(item)

              result.sort(
                  key=lambda item: (
                      item["_priority"],
                      item.get("local_date", ""),
                      item.get("time", "")
                  )
              )

              selected = result[:8]

              for item in selected:
                  item.pop("_priority", None)

              if not selected:
                  return [{
                      "type": "message",
                      "category": "CALCIO",
                      "title": "Nessuna partita rilevante in programma oggi tra Serie A, coppe europee e top club",
                      "source": "football-data.org"
                  }]

              return selected

          articles = []

          try:
              articles.extend(
                  fetch_football_matches()
              )
          except Exception as error:
              print("Errore recupero risultati calcio:", error)
              articles.append({
                  "type": "message",
                  "category": "CALCIO",
                  "title": "Risultati calcio momentaneamente non disponibili",
                  "source": "football-data.org"
              })

          feeds = [
              (
                  "CALCIOMERCATO",
                  'calciomercato OR "mercato serie a" OR "trattativa" OR "ufficiale" OR "accordo"'
              ),
              (
                  "CALCIO",
                  '"serie a" OR "coppa italia" OR "champions league" OR "europa league" OR "conference league"'
              ),
              (
                  "TENNIS",
                  'tennis OR ATP OR WTA OR Sinner'
              ),
              (
                  "PADEL",
                  'padel OR "Premier Padel" OR "FIP"'
              )
          ]

          for category, query in feeds:
              try:
                  articles.extend(
                      fetch_google_news(
                          category,
                          query,
                          limit=4
                      )
                  )
              except Exception as error:
                  print(
                      f"Errore recupero {category}:",
                      error
                  )

          output = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "local_date": now_italy.date().isoformat(),
              "articles": articles
          }

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Salvati {len(articles)} elementi")
          PY

      - name: Salva news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "Aggiorna notizie sportive"
            git push
          fi
