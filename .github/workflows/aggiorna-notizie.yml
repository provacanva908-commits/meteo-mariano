name: Aggiorna notizie sportive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sport-news-update
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna news.json
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python <<'PY'
          import html
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from email.utils import parsedate_to_datetime
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo('Europe/Rome')
          NOW = datetime.now(timezone.utc)
          LOCAL = NOW.astimezone(TZ)
          TOKEN = os.getenv('FOOTBALL_DATA_TOKEN', '').strip()
          OUTFILE = 'news.json'

          # Competizioni intere solo quelle rilevanti. Le leghe estere sono filtrate per squadra.
          ALL_COMPETITIONS = {'SA', 'CL', 'EL', 'CLI'}
          FOREIGN_LEAGUES = {'PL', 'PD', 'BL1', 'FL1', 'DED', 'PPL'}
          TOP_TEAMS = (
              'real madrid', 'barcelona', 'atletico madrid', 'atletico de madrid',
              'manchester city', 'man city', 'manchester united', 'man united',
              'liverpool', 'arsenal', 'chelsea', 'tottenham',
              'bayern munich', 'bayern munchen', 'bayern', 'borussia dortmund', 'dortmund',
              'paris saint germain', 'psg', 'olympique marseille', 'marseille',
              'olympique lyonnais', 'lyon', 'benfica', 'fc porto', 'porto',
              'sporting cp', 'sporting lisbon', 'ajax', 'psv', 'feyenoord',
          )
          BLOCKED = ('fotogallery', 'guarda il video', 'video:', 'gossip', 'foto:',
                     'oroscopo', 'highlights', 'social:', 'curiosita')
          CATEGORY_CONFIG = [
              ('CALCIOMERCATO', '(calciomercato OR trattativa OR cessione OR acquisto OR rinnovo) (Serie A OR Inter OR Milan OR Juventus OR Napoli OR Roma OR Como) when:2d', 4),
              ('CALCIO', '(Serie A OR Coppa Italia OR Champions League OR Europa League OR Conference League) (calcio OR risultato OR allenatore OR infortunio) when:2d', 4),
              ('TENNIS', '(tennis OR Sinner OR Alcaraz OR ATP OR WTA) when:2d', 3),
              ('PADEL', '(Premier Padel OR FIP padel OR padel mondiale) when:2d', 3),
          ]


          def clean(value):
              return re.sub(r'\s+', ' ', html.unescape(str(value or ''))).strip()


          def normalized(value):
              import unicodedata
              s = unicodedata.normalize('NFKD', clean(value).casefold())
              return ''.join(c for c in s if not unicodedata.combining(c))


          def team_is_top(team):
              name = normalized(team.get('name', '') + ' ' + team.get('shortName', ''))
              return any(re.search(r'(?<!\w)' + re.escape(w) + r'(?!\w)', name) for w in TOP_TEAMS)


          def request_json(url):
              req = urllib.request.Request(url, headers={
                  'X-Auth-Token': TOKEN,
                  'User-Agent': 'SportNews-MSA/2.0'
              })
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.load(r)


          def get_score(match):
              status = match.get('status', '')
              score = match.get('score') or {}
              if status in ('SCHEDULED', 'TIMED', 'POSTPONED', 'CANCELLED'):
                  return None, None
              for period in ('fullTime', 'halfTime'):
                  scores = score.get(period) or {}
                  home, away = scores.get('home'), scores.get('away')
                  if home is not None and away is not None:
                      return home, away
              return None, None


          def fetch_matches():
              if not TOKEN:
                  raise RuntimeError('Secret FOOTBALL_DATA_TOKEN mancante')
              # Un'unica chiamata, anziché una per campionato. Il servizio restituisce
              # solo le competizioni che l'account è autorizzato a leggere.
              qs = urllib.parse.urlencode({
                  'dateFrom': (LOCAL.date() - timedelta(days=1)).isoformat(),
                  'dateTo': (LOCAL.date() + timedelta(days=1)).isoformat()
              })
              data = request_json('https://api.football-data.org/v4/matches?' + qs)
              matches = []
              seen = set()
              for m in data.get('matches', []):
                  mid = m.get('id')
                  if mid in seen:
                      continue
                  seen.add(mid)
                  comp = m.get('competition') or {}
                  code = comp.get('code', '')
                  home_team = m.get('homeTeam') or {}
                  away_team = m.get('awayTeam') or {}
                  if code not in ALL_COMPETITIONS and not (
                      code in FOREIGN_LEAGUES and (team_is_top(home_team) or team_is_top(away_team))
                  ):
                      continue
                  start_str = m.get('utcDate') or ''
                  try:
                      kickoff = datetime.fromisoformat(start_str.replace('Z', '+00:00')).astimezone(TZ)
                  except ValueError:
                      continue
                  if kickoff.date() not in (LOCAL.date(), LOCAL.date() + timedelta(days=1)):
                      continue
                  status = m.get('status', 'SCHEDULED')
                  scores = get_score(m)
                  # Non inventare il LIVE: alcune fonti gratuite continuano a segnalare
                  # TIMED dopo il calcio d'inizio. Mostriamo un'etichetta cauta.
                  late = status in ('SCHEDULED', 'TIMED') and kickoff < LOCAL - timedelta(minutes=20)
                  labels = {
                      'IN_PLAY': 'LIVE', 'PAUSED': 'Intervallo',
                      'FINISHED': 'Finale', 'SCHEDULED': 'In programma',
                      'TIMED': 'In programma', 'POSTPONED': 'Rinviata',
                      'SUSPENDED': 'Sospesa', 'CANCELLED': 'Annullata'
                  }
                  item = {
                      'type': 'match', 'category': 'CALCIO',
                      'competition': clean(comp.get('name') or 'Calcio'),
                      'home': clean(home_team.get('shortName') or home_team.get('name') or 'Da definire'),
                      'away': clean(away_team.get('shortName') or away_team.get('name') or 'Da definire'),
                      'time': kickoff.strftime('%H:%M'),
                      'status': status,
                      'status_label': 'Stato da verificare' if late else labels.get(status, status),
                      'home_score': scores[0], 'away_score': scores[1],
                      'is_live': status in ('IN_PLAY', 'PAUSED'),
                      'local_date': kickoff.date().isoformat(),
                      '_rank': (0 if status in ('IN_PLAY', 'PAUSED') else
                                1 if status == 'FINISHED' else
                                2 if kickoff.date() == LOCAL.date() else 3),
                      '_kickoff': kickoff.isoformat()
                  }
                  matches.append(item)
              matches.sort(key=lambda m: (m['_rank'], m['_kickoff']))
              result = matches[:8]
              for item in result:
                  item.pop('_rank')
                  item.pop('_kickoff')
              return result


          def fetch_feed(category, query, limit):
              url = ('https://news.google.com/rss/search?q=' + urllib.parse.quote_plus(query)
                     + '&hl=it&gl=IT&ceid=IT:it')
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=20) as response:
                  root = ET.fromstring(response.read())
              result = []
              seen = set()
              for item in root.findall('./channel/item'):
                  title = clean(item.findtext('title', ''))
                  key = normalized(title)
                  if not title or key in seen or any(w in key for w in BLOCKED):
                      continue
                  seen.add(key)
                  try:
                      published = parsedate_to_datetime(item.findtext('pubDate', ''))
                      if published.tzinfo is None:
                          published = published.replace(tzinfo=timezone.utc)
                  except Exception:
                      continue
                  age = NOW - published.astimezone(timezone.utc)
                  if age < timedelta(minutes=-20) or age > timedelta(hours=48):
                      continue
                  # Requisito tematico più rigoroso del generico keyword-score.
                  if category == 'CALCIOMERCATO' and not any(w in key for w in (
                      'mercato', 'trattativ', 'ufficial', 'trasferiment', 'prestito',
                      'rinnov', 'acquist', 'cession', 'accordo', 'firma')):
                      continue
                  if category == 'PADEL' and 'padel' not in key and 'fip' not in key:
                      continue
                  source_element = item.find('source')
                  result.append({
                      'type': 'news', 'category': category,
                      'title': title, 'source': clean(source_element.text if source_element is not None else 'Google News'),
                      'published': published.isoformat(), '_date': published.timestamp()
                  })
              result.sort(key=lambda a: a['_date'], reverse=True)
              result = result[:limit]
              for row in result:
                  row.pop('_date')
              return result


          def main():
              errors = []
              articles = []
              try:
                  articles.extend(fetch_matches())
              except Exception as e:
                  errors.append('calcio: ' + str(e))
                  print('ATTENZIONE: risultati calcio non disponibili:', e)
              for category, query, limit in CATEGORY_CONFIG:
                  try:
                      items = fetch_feed(category, query, limit)
                      print(category, len(items), 'notizie')
                      articles.extend(items)
                  except Exception as e:
                      errors.append(category + ': ' + str(e))
                      print('ATTENZIONE:', category, e)
              # Se tutte le fonti falliscono, lascia intatto il file precedente.
              # Non trasformare un errore temporaneo in un feed vuoto.
              if not articles:
                  raise RuntimeError('Nessun dato valido ottenuto: news.json precedente conservato. ' + '; '.join(errors))
              data = {
                  'updated_at': NOW.isoformat(),
                  'local_date': LOCAL.date().isoformat(),
                  'articles': articles,
                  'sources_ok': len(CATEGORY_CONFIG) + 1 - len(errors),
                  'sources_total': len(CATEGORY_CONFIG) + 1,
                  'warnings': errors[:5]
              }
              with open(OUTFILE, 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
                  f.write('\n')
              print('Creati', len(articles), 'elementi; fonti con problemi:', len(errors))


          if __name__ == '__main__':
              main()
          PY

      - name: Salva solo se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
            exit 0
          fi
          git commit -m "Aggiorna notizie sportive"
          git pull --rebase origin main
          git push origin HEAD:main
